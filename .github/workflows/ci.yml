# CI for Mahjong Brain.
#
# The web/core job stays Linux-fast. A separate macOS gate compiles the actual
# iPhone+iPad target without signing so Swift, SPM, privacy-resource, or Xcode
# project regressions cannot land behind green browser-only checks.

name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push supersedes an in-flight run on the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npx tsc -b --pretty false

      - name: Lint
        # apps/marketing is excluded: Next.js conventions (metadata/viewport
        # exports beside a component, a generated next-env.d.ts) trip rules that
        # are correct everywhere else. Next has its own checks in its build.
        run: npx oxlint src packages apps/api

      - name: Approved visual system has not drifted
        run: npm run check:design-drift

      - name: Instrumentation smoke test
        # Drives the real state machines through the real ingest handler. Against
        # the dev store here; the Supabase run needs a project that does not
        # exist yet. Exits non-zero if a single event fails to arrive.
        run: npm run smoke:events
        env:
          MAHJONG_BRAIN_DEV_STORE: memory

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Native bundle contains the current production app
        run: npx cap copy ios && npm run ios:verify-bundle

      - name: Build marketing site
        run: npm run marketing:build

      - name: Verify approved brand assets
        run: npm run check:brand-assets

  # The trademark firewall is the one rule that cannot be left to review
  # attention: original art only, nothing borrowed from any incumbent. A binary
  # image entering the tile pipeline has to be a deliberate, visible act.
  original-art:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: No binary image assets added to the render pipeline
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          if [ -z "$base" ]; then echo "not a PR; skipping"; exit 0; fi
          added=$(git diff --name-only --diff-filter=A "$base" HEAD \
            | grep -E '^(src/render|packages/core)/.*\.(png|jpe?g|gif|webp|svg)$' || true)
          if [ -n "$added" ]; then
            echo "::error::Image assets added to the render pipeline:"
            echo "$added"
            echo "All tile art must be drawn in code (docs/DECISIONS.md D-006)."
            echo "If this asset is genuinely original, state its provenance in the"
            echo "PR body and remove this path from the check."
            exit 1
          fi
          echo "No image assets added to the render pipeline."

  native-ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build and sync current production web bundle
        run: npm run ios:sync

      - name: Native bundle matches production output byte-for-byte
        run: npm run ios:verify-bundle

      - name: Compile iPhone and iPad simulator app
        run: npm run ios:build-simulator
