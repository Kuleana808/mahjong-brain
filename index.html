<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <!--
      viewport-fit=cover so the board can sit under the notch; the app shell
      pads itself back out with env(safe-area-inset-*).
      maximum-scale is deliberately NOT set — pinch-zoom stays available, which
      WCAG 1.4.4 requires and which this audience actually uses.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#00483C" />
    <meta
      name="description"
      content="Mahjong Brain — a calm, readable mahjong solitaire game with a four-slot holder."
    />
    <title>Mahjong Brain</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
